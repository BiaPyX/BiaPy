# BiaPy version: 3.7.3

SYSTEM:
    NUM_CPUS: -1

PROBLEM:
    TYPE: INSTANCE_SEG
    NDIM: 3D
    INSTANCE_SEG:
        DATA_CHANNELS: BC
    TRACKING:
        ENABLE: True
        LINKER_MODEL: trackastra_ctc
        MASKS_PATH: ""  # folder with the masks of the frames, to link them without segmenting
        ALLOW_DIVISIONS: True
        GT_PATH: ""  # ground truth tracks in Cell Tracking Challenge format, to compute the tracking metrics

DATA:
    PATCH_SIZE: (20, 128, 128, 1)
    TRAIN:
        PATH: /path/to/data
        GT_PATH: /path/to/data
        IN_MEMORY: True
    VAL:
        SPLIT_TRAIN: 0.1
    TEST:
        PATH: /path/to/data  # one sequence: one volume per frame
        IN_MEMORY: True
        LOAD_GT: False
        PADDING: (4,16,16)

AUGMENTOR:
    ENABLE: True
    RANDOM_ROT: True
    VFLIP: True
    HFLIP: True
    ZFLIP: True

MODEL:
    ARCHITECTURE: unet
    FEATURE_MAPS: [16, 32, 64, 128, 256]
    Z_DOWN: [1,1,1,1]
    LOAD_CHECKPOINT: False

TRAIN:
    ENABLE: True
    OPTIMIZER: ADAMW
    LR: 1.E-3
    BATCH_SIZE: 2
    EPOCHS: 30
    PATIENCE: 30
    LR_SCHEDULER:
        NAME: 'onecycle'

TEST:
    ENABLE: True
    AUGMENTATION: False
    FULL_IMG: False
