{% set name = "biapy" %}
{% set version = "3.7.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 93394037e056a1e1e3a736f28e2576cc0c8f3dbc792e44631f92c2aef496dc45

build:
  noarch: python
  number: 0
  script: pip install . --no-deps --no-build-isolation
  entry_points:
    - biapy = biapy:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    # Must mirror pyproject.toml's torch/torchvision range exactly, or the `pip
    # check` in the test section fails against the installed sdist's metadata.
    - pytorch >=2.9,<3.0
    - torchvision >=0.24,<1.0
    - timm ==1.0.14
    - pytorch-msssim
    - torchmetrics >=1.4,<1.5
    # torchmetrics[image] extra (FID / Inception Score); conda has no extras
    - torch-fidelity <=0.4.0
    - scipy >1.0.0
    - safetensors
    - matplotlib-base >=3.7.1
    - scikit-learn >=1.4.0
    - pydot >=1.4.2
    - yacs >=0.1.8
    - tqdm >=4.66.1
    - scikit-image >=0.21.0
    - numba >=0.59
    - edt >=2.3.2
    - numpy >1.26
    - fill-voids >=2.0.6
    - opencv >=4.8.0
    - pandas >=1.5.3
    - torchinfo >=1.8.0
    - tensorboardX >=2.6.2.2
    - h5py >=3.9.0
    - zarr >=3.1.5
    - bioimageio.core ==0.11.0
    # bioimageio.spec 0.5.12.0 (required by bioimageio.core 0.11.0) fails to load any model with pydantic 2.14+
    - pydantic <2.14
    - imagecodecs >=2024.1.1
    - pooch >=1.8.1
    - xarray ==2025.1.*
    - nibabel >=5.4.2
    - pywavelets >=1.4.1
    - einops >=0.7.0

test:
  imports:
    - biapy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/BiaPyX/BiaPy
  license: MIT
  license_file: LICENSE.md
  summary: "BiaPy: Bioimage analysis pipelines in Python"

extra:
  recipe-maintainers:
    - danifranco
