rules:
  - reason: "BiaPy"
    cite: [biapy]

  # Model architectures (BiaPy's own models)
  - reason: "BiaPy's U-Net-like architectures"
    cite: [biapy_unet_architectures]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: [unet, resunet, seunet, resunet_se, attention_unet]}
  - reason: "Model architecture: U-Net"
    cite: [unet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: [unet, seunet, unext_v1, unext_v2]}
  - reason: "Model architecture: Residual U-Net"
    cite: [resunet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: [resunet, resunet_se]}
  - reason: "Model architecture: Squeeze-and-Excitation blocks"
    cite: [squeeze_excitation]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: [seunet, resunet_se]}
  - reason: "Model architecture: ResUNet++"
    cite: [resunet_plus_plus]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: resunet++}
  - reason: "Model architecture: Attention U-Net"
    cite: [attention_unet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: attention_unet}
  - reason: "Model architecture: MultiResUNet"
    cite: [multiresunet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: multiresunet}
  - reason: "Model architecture: UNETR"
    cite: [unetr]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: unetr}
  - reason: "Model architecture: ConvNeXt blocks (U-NeXt V1)"
    cite: [convnext]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: unext_v1}
  - reason: "Model architecture: ConvNeXt V2 blocks (U-NeXt V2)"
    cite: [convnext_v2]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: unext_v2}
  - reason: "Model architecture: HRNet"
    cite: [hrnet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: hrnet}
  - reason: "Model head: OCR"
    cite: [ocr_head]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: hrnet, MODEL.HRNET.HEAD_TYPE: OCR}
  - reason: "Model head: ASPP (DeepLabv3)"
    cite: [deeplabv3]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: hrnet, MODEL.HRNET.HEAD_TYPE: ASPP}
  - reason: "Model head: pyramid pooling (PSPNet)"
    cite: [pspnet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: hrnet, MODEL.HRNET.HEAD_TYPE: PSP}
  - reason: "Model architecture: STU-Net"
    cite: [stunet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: stunet}
  - reason: "Model architecture: NAFNet"
    cite: [nafnet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: nafnet}
  - reason: "Model architecture: Residual Diffusion Bridge Model"
    cite: [rdbm]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: rdbm}
  - reason: "Model architecture: Dense Prediction Transformer (DPT)"
    cite: [dpt]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: dpt}
  - reason: "Model architecture: ViT readout (as in Cellpose-SAM)"
    cite: [cellpose_sam]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: vit_readout}
  - reason: "Model architecture: EDSR"
    cite: [edsr]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: edsr}
  - reason: "Model architecture: RCAN"
    cite: [rcan]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: rcan}
  - reason: "Model architecture: DFCAN"
    cite: [dfcan]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: dfcan}
  - reason: "Model architecture: WDSR"
    cite: [wdsr]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: wdsr}
  - reason: "Model architecture: Wavelettention"
    cite: [wavelettention]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: wavelettention}
  - reason: "Model architecture: Vision Transformer (ViT)"
    cite: [vit]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: vit}
  - reason: "Model architecture: masked autoencoder (MAE)"
    cite: [mae]
    when:
      any:
        - {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: mae}
        - {PROBLEM.TYPE: SELF_SUPERVISED, PROBLEM.SELF_SUPERVISED.PRETEXT_TASK: masking}
  - reason: "Model architecture: EfficientNet"
    cite: [efficientnet]
    when: {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: {startswith: efficientnet}}

  # Pretrained ViT backbones ('MODEL.VIT_MODEL', or 'MODEL.UNETR_VIT_MODEL' for UNETR)
  - reason: "Model backbone: SAM 3 image encoder"
    cite: [sam3]
    when:
      any:
        - {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: [vit, dpt, vit_readout], MODEL.VIT_MODEL: sam3_vit}
        - {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: unetr, MODEL.UNETR_VIT_MODEL: sam3_vit}
  - reason: "Model backbone: DINOv3"
    cite: [dinov3]
    when:
      any:
        - {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: [vit, dpt, vit_readout], MODEL.VIT_MODEL: dinov3_vit}
        - {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: unetr, MODEL.UNETR_VIT_MODEL: dinov3_vit}
  - reason: "Model backbone: Cell-DINO"
    cite: [celldino]
    when:
      any:
        - {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: [vit, dpt, vit_readout], MODEL.VIT_MODEL: celldino_vit}
        - {MODEL.SOURCE: biapy, MODEL.ARCHITECTURE: unetr, MODEL.UNETR_VIT_MODEL: celldino_vit}

  # Models from other sources (cite also the model's own references, on its page)
  - reason: "Pretrained model from the BioImage Model Zoo"
    cite: [bioimage_model_zoo]
    when: {MODEL.SOURCE: bmz}
  - reason: "Pretrained model from TorchVision"
    cite: [torchvision]
    when: {MODEL.SOURCE: torchvision}

  # Instance segmentation
  - reason: "Instance segmentation: BiaPy's bottom-up approach"
    cite: [biapy_instance_seg]
    when: {PROBLEM.TYPE: INSTANCE_SEG}
  - reason: "Instance representation: star-convex distances (StarDist)"
    cite: [stardist]
    when: {PROBLEM.TYPE: INSTANCE_SEG, PROBLEM.INSTANCE_SEG.TYPE: regular, PROBLEM.INSTANCE_SEG.DATA_CHANNELS: {contains: R}}
  - reason: "Instance representation: star-convex distances in 3D (StarDist)"
    cite: [stardist_3d]
    when: {PROBLEM.TYPE: INSTANCE_SEG, PROBLEM.NDIM: 3D, PROBLEM.INSTANCE_SEG.TYPE: regular, PROBLEM.INSTANCE_SEG.DATA_CHANNELS: {contains: R}}
  - reason: "Instance representation: gradient flows (Cellpose)"
    cite: [cellpose]
    when: {PROBLEM.TYPE: INSTANCE_SEG, PROBLEM.INSTANCE_SEG.TYPE: regular, PROBLEM.INSTANCE_SEG.DATA_CHANNELS: {contains: Gv}}
  - reason: "Instance representation: gradient flows (Omnipose)"
    cite: [omnipose]
    when:
      PROBLEM.TYPE: INSTANCE_SEG
      PROBLEM.INSTANCE_SEG.TYPE: regular
      PROBLEM.INSTANCE_SEG.DATA_CHANNELS: {contains: Gv}
      PROBLEM.INSTANCE_SEG.DATA_CHANNELS_EXTRA_OPTS.0.Gv.gradient_type: omnipose
  - reason: "Instance representation: horizontal and vertical distances (HoVer-Net)"
    cite: [hovernet]
    when: {PROBLEM.TYPE: INSTANCE_SEG, PROBLEM.INSTANCE_SEG.TYPE: regular, PROBLEM.INSTANCE_SEG.DATA_CHANNELS: {contains_any: [H, V, Z]}}
  - reason: "Instance representation: pixel embeddings (EmbedSeg)"
    cite: [embedseg]
    when: {PROBLEM.TYPE: INSTANCE_SEG, PROBLEM.INSTANCE_SEG.TYPE: regular, PROBLEM.INSTANCE_SEG.DATA_CHANNELS: {contains: E}}
  - reason: "Instance representation: affinities, agglomerated as waterz does"
    cite: [mala]
    when: {PROBLEM.TYPE: INSTANCE_SEG, PROBLEM.INSTANCE_SEG.TYPE: regular, PROBLEM.INSTANCE_SEG.DATA_CHANNELS: {contains: A}}
  - reason: "Synapse detection: pre- and postsynaptic sites"
    cite: [synapse_partners]
    when: {PROBLEM.TYPE: INSTANCE_SEG, PROBLEM.INSTANCE_SEG.TYPE: synapses}
  - reason: "Instance matching metrics (code adapted from StarDist)"
    cite: [stardist]
    when: {PROBLEM.TYPE: INSTANCE_SEG, TEST.ENABLE: true, TEST.MATCHING_STATS: true}

  # Denoising
  - reason: "Self-supervised denoising: Noise2Void"
    cite: [noise2void]
    when: {PROBLEM.TYPE: DENOISING, MODEL.ARCHITECTURE: {not_in: [nafnet]}}
  - reason: "Self-supervised denoising of structured noise: structN2V"
    cite: [structn2v]
    when: {PROBLEM.TYPE: DENOISING, MODEL.ARCHITECTURE: {not_in: [nafnet]}, PROBLEM.DENOISING.N2V_STRUCTMASK: true}

  # Membrane repair (image to image)
  - reason: "Membrane repair: affinity agglomeration as waterz does"
    cite: [mala]
    when: {PROBLEM.TYPE: IMAGE_TO_IMAGE, PROBLEM.IMAGE_TO_IMAGE.MEMBRANE_REPAIR.ENABLE: true, PROBLEM.IMAGE_TO_IMAGE.MEMBRANE_REPAIR.POSTPROCESS.METHOD: agglomeration}
  - reason: "Membrane repair: SKOOTS target and post-processing"
    cite: [skoots]
    when:
      PROBLEM.TYPE: IMAGE_TO_IMAGE
      PROBLEM.IMAGE_TO_IMAGE.MEMBRANE_REPAIR.ENABLE: true
      any:
        - {LOSS.TYPE: {contains: SKOOTS}}
        - {PROBLEM.IMAGE_TO_IMAGE.MEMBRANE_REPAIR.POSTPROCESS.METHOD: skoots}

  # Losses
  - reason: "Loss: MALIS"
    cite: [malis]
    when: {TRAIN.ENABLE: true, LOSS.TYPE: {contains: MALIS}}
  - reason: "Loss: clDice"
    cite: [cldice]
    when: {TRAIN.ENABLE: true, LOSS.TYPE: {contains: CLDICE}}
  - reason: "Loss: supervoxel-based"
    cite: [supervoxel_loss]
    when: {TRAIN.ENABLE: true, LOSS.TYPE: {contains: SVOX}}
  - reason: "Loss: perceptual (VGG features)"
    cite: [perceptual_loss]
    when: {TRAIN.ENABLE: true, LOSS.TYPE: {contains: VGG}}
  - reason: "Loss: LPIPS"
    cite: [lpips]
    when: {TRAIN.ENABLE: true, LOSS.TYPE: {contains: LPIPS}}
  - reason: "Loss: adversarial, with a PatchGAN discriminator"
    cite: [pix2pix]
    when:
      TRAIN.ENABLE: true
      PROBLEM.TYPE: [IMAGE_TO_IMAGE, DENOISING]
      PROBLEM.IMAGE_TO_IMAGE.MEMBRANE_REPAIR.ENABLE: false
      LOSS.TYPE: {contains_any: [BCE, HINGE]}
  - reason: "Loss: pixel contrast"
    cite: [pixel_contrast]
    when: {TRAIN.ENABLE: true, LOSS.CONTRAST.ENABLE: true}

  # Training data
  - reason: "Training patches: foreground oversampling (as nnU-Net)"
    cite: [nnunet]
    when: {TRAIN.ENABLE: true, DATA.TRAIN.PATCH_SAMPLING: foreground_oversampling}
  - reason: "Data augmentation: Cutout"
    cite: [cutout]
    when: {TRAIN.ENABLE: true, AUGMENTOR.ENABLE: true, AUGMENTOR.CUTOUT: true}
  - reason: "Data augmentation: CutBlur"
    cite: [cutblur]
    when: {TRAIN.ENABLE: true, AUGMENTOR.ENABLE: true, AUGMENTOR.CUTBLUR: true}
  - reason: "Data augmentation: CutMix"
    cite: [cutmix]
    when: {TRAIN.ENABLE: true, AUGMENTOR.ENABLE: true, AUGMENTOR.CUTMIX: true}
  - reason: "Data augmentation: GridMask"
    cite: [gridmask]
    when: {TRAIN.ENABLE: true, AUGMENTOR.ENABLE: true, AUGMENTOR.GRIDMASK: true}
  - reason: "Data augmentation: misalignment and missing sections (code adapted from PyTorch Connectomics)"
    cite: [pytorch_connectomics]
    when:
      TRAIN.ENABLE: true
      AUGMENTOR.ENABLE: true
      any:
        - {AUGMENTOR.MISALIGNMENT: true}
        - {AUGMENTOR.MISSING_SECTIONS: true}
