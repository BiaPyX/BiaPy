# Works to cite when using BiaPy, and when each of them applies. Read by biapy.citations, which gives the
# citations of a configuration to the BiaPy runs (CITATIONS.md and citations.bib in the results folder), to the
# BioImage Model Zoo export (the model's "cite" field and its documentation) and to the front-ends (Fiji
# plugin, BiaPy-GUI).
#
# references: one entry per work, by id.
#   type     article | inproceedings | preprint | software
#   title, authors ("Family, Given"), year, venue (journal, conference or "arXiv"/"bioRxiv")
#   volume, pages, doi, arxiv, url   (optional; a DOI or an arXiv id is preferred to an URL)
#   code     (optional) repository BiaPy's implementation is adapted from
#
# rules: in order (it is the order of the citations), each one with
#   reason   why the works are cited, shown to the user (e.g. "Model architecture: U-Net")
#   cite     ids of the references
#   when     (optional, always if missing) condition on the configuration:
#              {KEY: value, ...}  all of them must hold. KEY is the variable's path, e.g. MODEL.ARCHITECTURE,
#                                 with numbers for list items (e.g. PROBLEM.INSTANCE_SEG.DATA_CHANNELS_EXTRA_OPTS.0)
#              value: a value (equal; texts ignore case), a list (any of them), or an operator:
#                {contains: x} / {contains_any: [x, y]}  the variable (a list) has x / any of them
#                {not_in: [x, y]}  none of them (also true when the variable is missing)
#                {startswith: x}
#              {any: [condition, ...]}  at least one of them holds
#              {not: condition}

